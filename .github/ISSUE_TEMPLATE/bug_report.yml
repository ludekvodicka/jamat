name: Bug report
description: Something is not working as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact tokens, absolute paths and anything private
        from logs and screenshots before you paste them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Jamat version
      description: The version on the status bar, far left. Example: 3.0.0
      placeholder: "3.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it happened
      options:
        - The desktop client
        - The Host (agent sessions, terminals)
        - The jamat-v3 command line client
        - Remote control between two computers
        - The reMarkable import
        - Somewhere else, or not sure
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent CLI and version
      description: Which agent the session was running, if the bug involves one.
      placeholder: "Claude Code 2.1.4 / Codex 0.9.0"

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - An installer from Releases
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Anything that shows the failure. Redact tokens, paths and personal data first.
